<!doctype html><html lang="de"><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bonusspiele – lokale Prüfung</title>
<link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/ipad.css"><link rel="stylesheet" href="/bonusgames.css"><link rel="stylesheet" href="/bonus-art.css"><link rel="stylesheet" href="/bonus-modern.css">

</head><body style="overflow:auto;padding:24px"><h1>Bonusspiele – lokale Prüfung</h1><p>Separate Testseite. Kein Zugriff auf den Hauptspielstand.</p><div id="games"></div><dialog id="modal"><div class="dialog-head"><h2></h2><button id="close">Schließen</button></div><div id="modal-content"></div></dialog>
<script>window.addEventListener('DOMContentLoaded',()=>{const modal=document.querySelector('#modal');window.WendeUI={open(title,html,kicker,mode){modal.querySelector('h2').textContent=title;modal.querySelector('#modal-content').innerHTML=html;modal.dataset.mode=mode;if(!modal.open)modal.showModal();},close(){BonusGames.stop();modal.close();}};document.querySelector('#close').onclick=()=>WendeUI.close();BonusGames.update({solved:['conflict','archive','vision','change','bridge','map312','council']});const games=document.querySelector('#games');games.innerHTML=BonusGames.journalHtml();BonusGames.bindJournal(games);});</script></body></html>
